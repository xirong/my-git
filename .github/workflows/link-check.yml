name: Link Check

on:
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/check-links.py"
      - ".github/workflows/link-check.yml"
  push:
    branches:
      - master
    paths:
      - "**/*.md"
      - "scripts/check-links.py"
      - ".github/workflows/link-check.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run link checks
        run: python scripts/check-links.py
